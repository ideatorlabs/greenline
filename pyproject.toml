[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenline"
version = "0.1.0"
description = "Self-hostable, multi-tenant engine for the WhatsApp Business Cloud API: sending, webhooks, consent and metering."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Ideator Labs", email = "ideatorlabs.ai@gmail.com" }]
keywords = ["whatsapp", "cloud-api", "messaging", "webhooks", "multi-tenant", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.24",
    "cryptography>=41",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.8",
    "fastapi>=0.100",
]

[project.urls]
Homepage = "https://github.com/ideatorlabs/greenline"
Repository = "https://github.com/ideatorlabs/greenline"
Issues = "https://github.com/ideatorlabs/greenline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/greenline"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ideator"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.coverage.run]
source = ["greenline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
